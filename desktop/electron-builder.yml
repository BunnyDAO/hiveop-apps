appId: io.hiveop.desktop
productName: HiveOp
copyright: HiveOp
directories:
  output: release
files:
  - dist/**
  - resources/**
  - package.json
# Version-less names keep github.com/BunnyDAO/hiveop-apps/releases/latest/download/<name> stable.
# The latest*.yml files electron-builder emits reference these same names, so electron-updater
# resolves them with no extra copies. The version lives in the yml and the release tag.
artifactName: HiveOp-${os}-${arch}.${ext}
publish:
  provider: github
  owner: BunnyDAO
  repo: hiveop-apps
  releaseType: release
protocols:
  - name: HiveOp
    schemes: [hiveop]

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - target: dmg
      arch: universal
  # Developer ID signed + notarized (Wenrwa LLC). Signing finds the identity in the login keychain;
  # notarization reads APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (App Store Connect API key):
  #   set -a; . ~/.hiveop-keys/devid/notarize.env; set +a; npm run dist:mac
  # scripts/notarize-dmg.sh then notarizes + staples the dmg itself and refreshes its blockmap/yml.
  # A stable Team ID means macOS keeps the mic grant across updates (ad-hoc re-asked every time).
  identity: "Wenrwa LLC (ATG843LDGZ)"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: HiveOp uses the microphone for voice dictation.
    NSCameraUsageDescription: HiveOp uses the camera when a page you open asks for it.
  x64ArchFiles: "**/*"   # universal merge: tolerate identical files

dmg:
  sign: true
  artifactName: HiveOp-mac-universal.${ext}

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64
  # Signing off. To sign: set CSC_LINK/CSC_KEY_PASSWORD (or azureSignOptions) and drop `signAndEditExecutable: false`.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  artifactName: HiveOp-win-x64.${ext}
  allowToChangeInstallationDirectory: true

linux:
  icon: resources/icon.png
  category: Development
  maintainer: HiveOp <support@hiveop.io>
  synopsis: HiveOp desktop app
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  mimeTypes:
    - x-scheme-handler/hiveop

appImage:
  artifactName: HiveOp-linux-x86_64.${ext}

deb:
  artifactName: HiveOp-linux-amd64.${ext}
