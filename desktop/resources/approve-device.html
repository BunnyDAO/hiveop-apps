<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Allow a new device?</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0d12; --card: #161a22; --line: #2a303c; --text: #e8eaf0; --muted: #b4bac8;
    --accent: #f5b301; --on-accent: #111; --bad: #ff8a80; --good: #7ee0a1;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --card: #ffffff; --line: #d5d9e0; --text: #14161c; --muted: #4a5160; --bad: #b3261e; --good: #1e7b45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  main { padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  p { margin: 0; color: var(--muted); }
  .device { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .device svg { flex: none; width: 24px; height: 24px; color: var(--accent); }
  .device b { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  label { font-size: 15px; font-weight: 600; }
  input#code {
    width: 100%; height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--text);
    font: 600 30px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.4em; text-align: center; padding: 0 0 0 0.4em;
    -webkit-user-select: text; user-select: text;
  }
  input#code:focus { outline: none; border-color: var(--accent); }
  .msg { min-height: 20px; font-size: 14px; color: var(--bad); }
  .hint { font-size: 14px; }
  .row { display: flex; gap: 12px; margin-top: auto; }
  button { flex: 1; min-height: 44px; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button:disabled { cursor: default; }
  button.primary:disabled { background: var(--card); color: var(--muted); border-color: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .result { display: flex; flex-direction: column; gap: 10px; }
  .result .icon { width: 44px; height: 44px; }
  .ok .icon { color: var(--good); }
  .no .icon { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="ask" hidden>
  <h1>Allow a new device?</h1>
  <div class="device">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
    <b id="name"></b>
  </div>
  <label for="code">Type the code on your phone</label>
  <input id="code" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="6" placeholder="······" aria-describedby="msg">
  <div class="msg" id="msg" role="alert"></div>
  <p class="hint">Only approve your own device.</p>
  <div class="row">
    <button id="deny" type="button">Deny</button>
    <button id="approve" class="primary" type="button" disabled>Approve</button>
  </div>
</main>

<main id="done" hidden>
  <div class="result" id="result">
    <svg class="icon" id="icon-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
    <svg class="icon" id="icon-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>
    <h1 id="r-title"></h1>
    <p id="r-body"></p>
  </div>
  <div class="row"><button id="close" class="primary" type="button">Done</button></div>
</main>

<script>
  var api = window.hiveopDevices;
  var $ = function (id) { return document.getElementById(id); };
  var code = $('code'), approveBtn = $('approve'), busy = false;

  function digits() { return code.value.replace(/\D/g, '').slice(0, 6); }
  function sync() { approveBtn.disabled = busy || digits().length !== 6; }

  function show(v) {
    if (!v) return;
    if (v.kind === 'ask') {
      $('done').hidden = true; $('ask').hidden = false;
      $('name').textContent = v.name; // a name the phone chose: text only, never HTML
      code.value = ''; $('msg').textContent = ''; busy = false; approveBtn.textContent = 'Approve'; sync();
      code.focus();
      return;
    }
    if (v.kind === 'invalid') { $('msg').textContent = 'Enter all six digits.'; return; }
    if (v.kind === 'unreachable') { $('msg').textContent = "Can't reach HiveOp. Try again."; return; }
    var ok = v.kind === 'approved';
    var t = { approved: 'Device added', mismatch: "Code didn't match", expired: 'Request expired' }[v.kind];
    if (!t) return;
    $('ask').hidden = true; $('done').hidden = false;
    $('result').className = 'result ' + (ok ? 'ok' : 'no');
    $('icon-ok').toggleAttribute('hidden', !ok); $('icon-no').toggleAttribute('hidden', ok); // SVG has no .hidden property
    $('r-title').textContent = t;
    $('r-body').textContent = ok ? (v.name + ' can reach this Mac.') : 'Start again on your phone.';
    $('close').textContent = ok ? 'Done' : 'Close';
    $('close').focus();
  }

  code.addEventListener('input', function () {
    var d = digits();
    if (code.value !== d) code.value = d;
    $('msg').textContent = '';
    sync();
  });
  code.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !approveBtn.disabled) approve();
    if (e.key === 'Escape') api.deny();
  });
  function approve() {
    if (busy || digits().length !== 6) return;
    busy = true; approveBtn.textContent = 'Checking…'; sync();
    api.approve(digits()).then(function (v) {
      busy = false; approveBtn.textContent = 'Approve'; sync();
      show(v);
    }, function () {
      busy = false; approveBtn.textContent = 'Approve'; sync();
      show({ kind: 'unreachable' });
    });
  }
  approveBtn.addEventListener('click', approve);
  $('deny').addEventListener('click', function () { api.deny(); });
  $('close').addEventListener('click', function () { api.close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('done').hidden) api.close(); });
  api.onState(show);
  api.state().then(show);
</script>
</body>
</html>
