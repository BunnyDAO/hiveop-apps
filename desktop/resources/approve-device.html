<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Allow a new device?</title>
<style>
  /* HiveOp's own palette (arena lib/mobileTheme.ts + components/mobile/ui/tokens.ts).
     The app is dark-only, so these windows are too. */
  :root {
    color-scheme: dark;
    --frame: #070e13; --surf: #0d1720; --edge: #1e3243; --hair: #1a2a38;
    --text: #e8eef4; --label: #c3cfd9; --subtle: #a9b8c5;
    --primary: #00a6f4; --on-primary: #03131d; --link: #5cc8ff;
    --panel: #0b2233; --panel-edge: rgba(0, 166, 244, 0.5);
    --field: #0b141c; --field-edge: #23384a; --placeholder: #8fa1b1;
    --off-bg: #16212b; --off-fg: #8d9faf;
    --ok: #22c55e; --warn: #f5b335; --bad: #ff9a9a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--frame); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
  main { padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; color: var(--text); }
  p { margin: 0; color: var(--subtle); font-size: 14px; }
  .device { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border: 1px solid var(--edge); border-radius: 12px; background: var(--surf); }
  .device .ico { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--panel); color: var(--link); }
  .device svg { width: 20px; height: 20px; }
  .device .who { min-width: 0; display: flex; flex-direction: column; }
  .device b { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .device .who > span { font-size: 13px; color: var(--subtle); }
  .panel { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--panel-edge); border-radius: 12px; background: var(--panel); }
  label { font-size: 15px; font-weight: 600; color: var(--text); }
  input#code {
    width: 100%; height: 56px; border-radius: 10px; border: 1px solid var(--field-edge); background: var(--field); color: #fff;
    font: 600 28px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums;
    letter-spacing: 0.18em; text-align: center; padding: 0 0 0 0.18em;
    -webkit-user-select: text; user-select: text;
  }
  input#code::placeholder { color: var(--placeholder); }
  input#code:focus { outline: none; border-color: var(--primary); }
  .msg { min-height: 18px; font-size: 13px; color: var(--bad); }
  .msg:empty { display: none; }
  .hint { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--label); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
  .row { display: flex; gap: 8px; margin-top: auto; }
  button { flex: 1; min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; cursor: pointer; border: 1px solid #2e475b; background: transparent; color: var(--text); }
  button:hover { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.04); }
  button.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled, button.primary:disabled { cursor: not-allowed; background: var(--off-bg); color: var(--off-fg); border-color: transparent; filter: none; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .result { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border: 1px solid var(--edge); border-radius: 12px; background: var(--surf); }
  .result.ok { border-color: var(--panel-edge); background: var(--panel); }
  .result .icon { width: 40px; height: 40px; stroke-linecap: round; stroke-linejoin: round; }
  .ok .icon { color: var(--ok); }
  .no .icon { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="ask" hidden>
  <h1>Allow a new device?</h1>
  <div class="device">
    <span class="ico" id="kind"></span>
    <span class="who"><b id="name"></b><span>Wants to reach this Mac</span></span>
  </div>
  <div class="panel">
    <label for="code">Type the code on your phone</label>
    <input id="code" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="6" placeholder="······" aria-describedby="msg">
    <div class="msg" id="msg" role="alert"></div>
  </div>
  <p class="hint"><span class="dot" aria-hidden="true"></span>Only approve your own device.</p>
  <div class="row">
    <button id="deny" type="button">Deny</button>
    <button id="approve" class="primary" type="button" disabled>Approve</button>
  </div>
</main>

<main id="done" hidden>
  <div class="result" id="result">
    <svg class="icon" id="icon-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
    <svg class="icon" id="icon-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>
    <h1 id="r-title"></h1>
    <p id="r-body"></p>
  </div>
  <div class="row"><button id="close" class="primary" type="button">Done</button></div>
</main>

<script>
  var api = window.hiveopDevices;
  var $ = function (id) { return document.getElementById(id); };
  var code = $('code'), approveBtn = $('approve'), busy = false;

  // A device-kind glyph from the name the phone chose (static markup; the name stays text).
  var ICONS = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
    tablet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
    computer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4.5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></svg>'
  };
  function kindOf(n) {
    n = String(n || '');
    if (/ipad|tablet|galaxy tab/i.test(n)) return 'tablet';
    if (/iphone|android|pixel|phone|galaxy|mobile/i.test(n)) return 'phone';
    return 'computer';
  }

  function digits() { return code.value.replace(/\D/g, '').slice(0, 6); }
  function sync() { approveBtn.disabled = busy || digits().length !== 6; }

  function show(v) {
    if (!v) return;
    if (v.kind === 'ask') {
      $('done').hidden = true; $('ask').hidden = false;
      $('name').textContent = v.name; // a name the phone chose: text only, never HTML
      $('kind').innerHTML = ICONS[kindOf(v.name)]; // static markup only
      code.value = ''; $('msg').textContent = ''; busy = false; approveBtn.textContent = 'Approve'; sync();
      code.focus();
      return;
    }
    if (v.kind === 'invalid') { $('msg').textContent = 'Enter all six digits.'; return; }
    if (v.kind === 'unreachable') { $('msg').textContent = "Can't reach HiveOp. Try again."; return; }
    var ok = v.kind === 'approved';
    var t = { approved: 'Device added', mismatch: "Code didn't match", expired: 'Request expired' }[v.kind];
    if (!t) return;
    $('ask').hidden = true; $('done').hidden = false;
    $('result').className = 'result ' + (ok ? 'ok' : 'no');
    $('icon-ok').toggleAttribute('hidden', !ok); $('icon-no').toggleAttribute('hidden', ok); // SVG has no .hidden property
    $('r-title').textContent = t;
    $('r-body').textContent = ok ? (v.name + ' can reach this Mac.') : 'Start again on your phone.';
    $('close').textContent = ok ? 'Done' : 'Close';
    $('close').focus();
  }

  code.addEventListener('input', function () {
    var d = digits();
    if (code.value !== d) code.value = d;
    $('msg').textContent = '';
    sync();
  });
  code.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !approveBtn.disabled) approve();
    if (e.key === 'Escape') api.deny();
  });
  function approve() {
    if (busy || digits().length !== 6) return;
    busy = true; approveBtn.textContent = 'Checking…'; sync();
    api.approve(digits()).then(function (v) {
      busy = false; approveBtn.textContent = 'Approve'; sync();
      show(v);
    }, function () {
      busy = false; approveBtn.textContent = 'Approve'; sync();
      show({ kind: 'unreachable' });
    });
  }
  approveBtn.addEventListener('click', approve);
  $('deny').addEventListener('click', function () { api.deny(); });
  $('close').addEventListener('click', function () { api.close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('done').hidden) api.close(); });
  api.onState(show);
  api.state().then(show);
</script>
</body>
</html>
