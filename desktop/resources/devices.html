<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Devices that can reach this Mac</title>
<style>
  /* HiveOp's own palette (arena lib/mobileTheme.ts + components/mobile/ui/tokens.ts).
     The app is dark-only, so this window is too. */
  :root {
    color-scheme: dark;
    --frame: #070e13; --surf: #0d1720; --edge: #1e3243; --hair: #1a2a38;
    --text: #e8eef4; --heading: #b8c5d0; --subtle: #a9b8c5;
    --primary: #00a6f4; --link: #5cc8ff; --panel: #0b2233; --off-fg: #8d9faf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--frame); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
  main { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; color: var(--text); }
  p { margin: 0; color: var(--subtle); font-size: 14px; }
  h1 + p { margin-bottom: 8px; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--edge); border-radius: 12px; background: var(--surf); overflow: hidden; }
  ul:empty { display: none; }
  li { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 8px 10px 14px; }
  li + li { border-top: 1px solid var(--hair); }
  .ico { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--panel); color: var(--link); }
  .ico svg { width: 20px; height: 20px; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .who span i { font-style: normal; white-space: nowrap; }
  .who span { display: block; margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--subtle); }
  button { flex: none; min-height: 44px; min-width: 44px; padding: 0 10px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 0; background: transparent; color: var(--link); }
  button:hover { background: rgba(255, 255, 255, 0.06); }
  button:disabled { cursor: not-allowed; color: var(--off-fg); background: transparent; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .empty { padding: 14px 16px; border: 1px solid var(--edge); border-radius: 12px; background: var(--surf); display: flex; flex-direction: column; gap: 4px; }
  .empty b { font-size: 15px; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Devices that can reach this Mac</h1>
  <p>They can open agents here.</p>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    <b>No devices yet</b>
    <p>Pair one from your phone.</p>
  </div>
</main>
<script>
  var api = window.hiveopDevices;
  // A device-kind glyph from the name the device chose (static markup; the name stays text).
  var ICONS = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
    tablet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
    computer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4.5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></svg>'
  };
  function kindOf(n) {
    n = String(n || '');
    if (/ipad|tablet|galaxy tab/i.test(n)) return 'tablet';
    if (/iphone|android|pixel|phone|galaxy|mobile/i.test(n)) return 'phone';
    return 'computer';
  }

  function added(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : 'Added ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function render(rows) {
    if (!Array.isArray(rows)) return;
    var list = document.getElementById('list');
    list.textContent = '';
    document.getElementById('empty').hidden = rows.length > 0;
    rows.forEach(function (r) {
      var li = document.createElement('li');
      var ico = document.createElement('span'); ico.className = 'ico';
      ico.innerHTML = ICONS[kindOf(r.name)]; // static markup only; device names go in as text below
      li.appendChild(ico);
      var who = document.createElement('div'); who.className = 'who';
      var b = document.createElement('b'); b.textContent = r.name;
      var s = document.createElement('span');
      [added(r.approvedAt), 'Key ' + String(r.keyId).slice(0, 8)].filter(Boolean).forEach(function (t, i) {
        var part = document.createElement('i'); part.textContent = (i ? ' · ' : '') + t; s.appendChild(part);
      });
      who.appendChild(b); who.appendChild(s);
      var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Remove';
      btn.setAttribute('aria-label', 'Remove ' + r.name);
      btn.addEventListener('click', function () {
        btn.disabled = true;
        api.remove(r.keyId).then(function () { btn.disabled = false; }, function () { btn.disabled = false; });
      });
      li.appendChild(who); li.appendChild(btn);
      list.appendChild(li);
    });
  }

  api.onList(render);
  api.list().then(render);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') api.close(); });
</script>
</body>
</html>
