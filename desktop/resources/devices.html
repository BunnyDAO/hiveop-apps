<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Devices that can reach this Mac</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0d12; --card: #161a22; --line: #2a303c; --text: #e8eaf0; --muted: #b4bac8; --accent: #f5b301; --bad: #ff8a80;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --card: #ffffff; --line: #d5d9e0; --text: #14161c; --muted: #4a5160; --bad: #b3261e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  main { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  p { margin: 0; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  li svg { flex: none; width: 22px; height: 22px; color: var(--accent); }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .who span i { font-style: normal; white-space: nowrap; }
  .who span { display: block; font-size: 14px; color: var(--muted); }
  button { min-height: 44px; min-width: 88px; padding: 0 16px; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--bad); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { padding: 24px 16px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
  .empty b { font-size: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Devices that can reach this Mac</h1>
  <p>They can open agents here.</p>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    <b>No devices yet</b>
    <p>Pair one from your phone.</p>
  </div>
</main>
<script>
  var api = window.hiveopDevices;
  var phone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>';

  function added(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : 'Added ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function render(rows) {
    if (!Array.isArray(rows)) return;
    var list = document.getElementById('list');
    list.textContent = '';
    document.getElementById('empty').hidden = rows.length > 0;
    rows.forEach(function (r) {
      var li = document.createElement('li');
      li.innerHTML = phone; // static markup only; device names go in as text below
      var who = document.createElement('div'); who.className = 'who';
      var b = document.createElement('b'); b.textContent = r.name;
      var s = document.createElement('span');
      [added(r.approvedAt), 'Key ' + String(r.keyId).slice(0, 8)].filter(Boolean).forEach(function (t, i) {
        var part = document.createElement('i'); part.textContent = (i ? ' · ' : '') + t; s.appendChild(part);
      });
      who.appendChild(b); who.appendChild(s);
      var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Remove';
      btn.setAttribute('aria-label', 'Remove ' + r.name);
      btn.addEventListener('click', function () {
        btn.disabled = true;
        api.remove(r.keyId).then(function () { btn.disabled = false; }, function () { btn.disabled = false; });
      });
      li.appendChild(who); li.appendChild(btn);
      list.appendChild(li);
    });
  }

  api.onList(render);
  api.list().then(render);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') api.close(); });
</script>
</body>
</html>
