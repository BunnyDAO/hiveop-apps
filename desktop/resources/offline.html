<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>HiveOp</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e8eaf0; font: 16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #aab0c0; }
  a.btn { display: inline-block; padding: 10px 22px; border-radius: 8px; background: #f5b301; color: #111; font-weight: 600; text-decoration: none; }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #14161c; } p { color: #555c6b; } }
  /* No title bar on a Mac: the top strip drags the window. */
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 28px; -webkit-app-region: drag; }
  button, a { -webkit-app-region: no-drag; }
</style>
</head>
<body>
<main>
  <h1>Can't reach HiveOp</h1>
  <p id="msg">Check your connection. Retrying automatically.</p>
  <a class="btn" href="hiveop-retry:now">Retry</a>
</main>
<script>
  var next = new URLSearchParams(location.search).get('next');
  if (next) document.getElementById('msg').textContent = 'Check your connection. Retrying in ' + Math.round(next / 1000) + 's.';
</script>
</body>
</html>
