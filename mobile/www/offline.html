<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HiveOp</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d12; }
  body { display: grid; place-items: center; color: #e8eaf0; font: 17px/1.4 -apple-system, system-ui, Roboto, sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  main { text-align: center; max-width: 320px; }
  svg { width: 56px; height: 56px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #d4d8e2; font-size: 16px; }
  button { font: inherit; font-weight: 600; min-height: 48px; padding: 0 28px; border: 0; border-radius: 10px; background: #f5b301; color: #111; }
  button:active { opacity: .85; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="#1fc4ee" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/></svg>
  <h1>Can't reach HiveOp</h1>
  <p id="msg">Check your connection.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>// Retry scheduling for the "Can't reach HiveOp" page. Plain ES module, no dependencies,
// so the page loads it as-is and vitest tests it directly.
const BASE_MS = 2000;
const CAP_MS = 30000;

/** Delay before retry number `attempt` (0-based): 2s, 4s, 8s ... capped at 30s. */
function retryDelayMs(attempt) {
  const n = Number.isFinite(attempt) && attempt > 0 ? Math.floor(attempt) : 0;
  return Math.min(BASE_MS * 2 ** Math.min(n, 10), CAP_MS);
}

/**
 * probe() -> Promise<boolean> says whether the site answers. onReachable() fires once when
 * it does (the page then navigates to the site). The timer functions are injectable.
 */
function createRetrier({ probe, onReachable, setTimer = setTimeout, clearTimer = clearTimeout }) {
  let attempt = 0;
  let timer = null;
  let nextMs = 0;
  let done = false;
  let probing = false;

  function schedule() {
    clearTimer(timer);
    nextMs = retryDelayMs(attempt);
    timer = setTimer(run, nextMs);
  }

  async function run() {
    if (done || probing) return;
    probing = true;
    let ok = false;
    try {
      ok = await probe();
    } catch {
      ok = false;
    }
    probing = false;
    if (done) return;
    if (ok) {
      done = true;
      clearTimer(timer);
      onReachable();
      return;
    }
    attempt += 1;
    schedule();
  }

  return {
    start: schedule,
    /** Try again button, or the app coming back to the foreground. */
    tryNow() {
      clearTimer(timer);
      void run();
    },
    /** The OS reports the network changed: probe now and restart the backoff. */
    networkChanged() {
      attempt = -1; // the failed probe below counts as attempt 0, so the next wait is 2s
      clearTimer(timer);
      void run();
    },
    nextInMs: () => nextMs,
  };
}

const SITE_URL = "https://app.hiveop.io/";

const msg = document.getElementById('msg');

async function probe() {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 8000);
  try {
    // no-cors: any answer from the server resolves; only a network failure rejects.
    await fetch(SITE_URL, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal });
    return true;
  } catch {
    return false;
  } finally {
    clearTimeout(t);
  }
}

const retrier = createRetrier({
  probe,
  onReachable: () => location.replace(SITE_URL),
});

document.getElementById('retry').addEventListener('click', () => {
  msg.textContent = 'Trying…';
  retrier.tryNow();
});
window.addEventListener('online', () => retrier.networkChanged());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') retrier.tryNow();
});
setInterval(() => {
  msg.textContent = 'Check your connection. Retrying automatically.';
}, 4000);
retrier.start();
</script>
</body>
</html>
